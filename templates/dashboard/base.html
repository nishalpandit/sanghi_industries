{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanghi Industries</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}">
  <link rel="stylesheet" href="{% static 'dashboard/css/dashboard.css' %}">
  <link rel="stylesheet" href="{% static 'dashboard/css/users.css' %}">
  <link rel="stylesheet" href="{% static 'dashboard/css/templates.css' %}">
  <link rel="stylesheet" href="{% static 'dashboard/css/responsive.css' %}">
</head>

<body>
  <div class="admin-wrapper">
    <!-- Sidebar -->
    {% include 'dashboard/includes/sidebar.html' %}
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
      {% include 'dashboard/includes/header.html' %}

      <div class="page-content">
        {% block content %}
        {% endblock %}
      </div>
      {% include 'dashboard/includes/footer.html' %}
    </main>
  </div>

  {% block extra_body %}
  {% endblock %}

  <script src="{% static 'dashboard/js/main.js' %}"></script>
  {% block extra_js %}
  {% endblock %}
</body>

</html>
